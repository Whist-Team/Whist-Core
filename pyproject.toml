[project]
name = "whist-core"
# remember to also update the version in __init__.py and docs/source/conf.py!
version = "0.9.2"
description = "Whist rules implementation"
authors = [{ name = "Whist-Team" }]
license = "MIT"
readme = "README.md"
keywords = ["game", "whist"]
classifiers = [
    "Operating System :: OS Independent"
]
requires-python = ">=3.10"
dependencies = [
    "deprecation>=2.1.0",
    "pydantic>=2.12.5",
    "typing-extensions>=4.15.0",
]

[project.urls]
homepage = "https://github.com/Whist-Team/Whist-Core"
source = "https://github.com/Whist-Team/Whist-Core"
documentation = "https://whist-core.readthedocs.io"
issues = "https://github.com/Whist-Team/Whist-Core/issues"

[dependency-groups]
dev = [
    "pylint>=4.0.5",
    "pylint-pydantic>=0.4.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.8",
    "ty>=0.0.27",
]
docs = [
    "sphinx>=8.1.3", # keeping this on an older version so we can install this with our older minimum python requirement
    "sphinx-autoapi>=3.8.0",
    "sphinx-rtd-theme>=3.1.0",
]

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[tool.pylint]
ignore-paths = [".venv", "docs", "tests"]
load-plugins = "pylint_pydantic"
py-version = "3.10"
max-line-length = 120

[tool.ruff]
extend-exclude = ["docs", ".venv"]
line-length = 120

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
exclude = ["tests/**"]
select = ["ALL"]
ignore = [
    "ANN", # flake8-annotations
    "EM", # flake8-errmsg
    "FIX", # flake8-fix-me
    "TD", # flake8-todos
    "TRY003", # raise-vanilla-args
    "RUF012", # mutable-class-default
    "COM812", # missing-trailing-comma
    "D102", # undocumented-public-method
    "D104", # undocumented-public-package
    "D105", # undocumented-magic-method
    "D106", # undocumented-public-nested-class
    "D200", # unnecessary-multiline-docstring
    "D205", # missing-blank-line-after-summary
    "D400", # missing-trailing-period
    "D401"# non-imperative-mood
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
split-on-trailing-comma = false
