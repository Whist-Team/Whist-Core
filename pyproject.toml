[project]
name = "whist-core"
# remember to also update the version in __init__.py and docs/source/conf.py!
version = "0.9.2"
description = "Whist rules implementation"
authors = [{ name = "Whist-Team" }]
license = "MIT"
readme = "README.md"
keywords = ["game", "whist"]
classifiers = [
    "Operating System :: OS Independent"
]
requires-python = ">=3.10"
dependencies = [
    "deprecation>=2.1.0",
    "pydantic>=2.12.5",
]

[project.urls]
homepage = "https://github.com/Whist-Team/Whist-Core"
source = "https://github.com/Whist-Team/Whist-Core"
documentation = "https://whist-core.readthedocs.io"
issues = "https://github.com/Whist-Team/Whist-Core/issues"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "flake8-docstrings>=1.7.0",
    "flake8-pyproject>=1.2.4",
    "pylint>=4.0.5",
    "pylint-pydantic>=0.4.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.8",
    "ty>=0.0.27",
]
docs = [
    "sphinx>=8.1.3", # keeping this on an older version so we can install this with our older minimum python requirement
    "sphinx-autoapi>=3.8.0",
    "sphinx-rtd-theme>=3.1.0",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.pylint]
ignore-paths = [".venv", "docs", "tests"]
load-plugins = "pylint_pydantic"
py-version = "3.10"
max-line-length = 120

[tool.flake8]
exclude = [
    ".git",
    ".github",
    ".venv",
    "__pycache__",
    ".eggs",
    "*.egg",
    "*.egg-info",
    "build",
    "dist",
    "venv",
    "tests",
    "docs",
]
ignore = ["D200", "D204", "D205", "D400", "D401"]
max-line-length = 100
max-complexity = 10
count = true
